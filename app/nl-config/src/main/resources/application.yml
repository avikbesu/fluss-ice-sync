# Baked-in defaults for the nl-config service. In this repo's Docker Compose
# deployment these are overridden by config/apps/nl-config/application.yaml,
# mounted read-only at /config/application.yaml -- see app/nl-api's
# identical pattern. Any property can also be overridden by an environment
# variable via Spring Boot's relaxed binding (e.g. NLCONFIG_STORE_DIRECTORY).

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: fluss-ice-sync-nl-config
  lifecycle:
    timeout-per-shutdown-phase: 15s
  config:
    import: "optional:file:/config/application.yaml"
  servlet:
    multipart:
      max-request-size: 5MB
      max-file-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    # This service's one real dependency is the mounted volume, not a
    # database/network call -- ConfigVolumeHealthIndicator is what actually
    # backs both liveness and readiness here.
    diskspace:
      enabled: true

nlconfig:
  store:
    directory: /data/configs
    limits:
      maxNameLength: 200
      maxSourceLength: 500
      maxBusinessDescriptionLength: 10000
      maxColumnDescriptionLength: 2000
      maxExampleQuestionLength: 500
      maxExampleQuestions: 50
      maxColumns: 500
      maxCatalogSchemaTableLength: 200

logging:
  level:
    com.flusssync.nlconfig: INFO
