import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.1.20'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

springBoot {
    mainClass = 'com.flusssync.nlconfig.NlConfigApplicationKt'
}

// Fixed name so app/nl-config/Dockerfile's COPY path never needs to guess
// it -- same reasoning as app/nl-api/build.gradle's identical block.
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        // JUnit5 + MockK is this module's mocking stack -- see app/nl-api's
        // identical build.gradle comment for why Mockito is excluded.
        exclude group: 'org.mockito'
    }
    testImplementation 'io.mockk:mockk:1.14.11'
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
        freeCompilerArgs.add('-Xjsr305=strict')
    }
}

test {
    useJUnitPlatform()
}
