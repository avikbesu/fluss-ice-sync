import org.gradle.jvm.application.tasks.CreateStartScripts

plugins {
    id 'application'
}

application {
    mainClass = 'com.flusssync.Main'
    // fluss-client uses Apache Arrow internally, which needs reflective
    // access to java.nio.Buffer's internals on Java 17+; without this the
    // JVM throws InaccessibleObjectException the first time a row is
    // written. See https://arrow.apache.org/docs/java/install.html
    applicationDefaultJvmArgs = ['--add-opens=java.base/java.nio=ALL-UNNAMED']
}

// fluss-client's jar embeds its own (older, unshaded) org.slf4j.* classes,
// so the classpath order determines which Logger implementation actually
// gets loaded at runtime. The default classpath generated by the
// application plugin puts fluss-client ahead of our slf4j-api/logback
// jars; put those two first explicitly so the real SLF4J 2.x binding wins.
tasks.named('startScripts', CreateStartScripts).configure {
    def runtimeJars = configurations.runtimeClasspath
    def priorityJars = runtimeJars.filter { it.name.startsWith('slf4j-api') || it.name.startsWith('logback') }
    def otherJars = runtimeJars.filter { !it.name.startsWith('slf4j-api') && !it.name.startsWith('logback') }
    classpath = files(tasks.named('jar'), priorityJars, otherJars)
}

dependencies {
    implementation libs.fluss.client
    implementation libs.jackson.databind
    implementation libs.jackson.dataformat.yaml
    implementation libs.sqlite.jdbc
    implementation libs.slf4j.api
    runtimeOnly libs.logback.classic

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testRuntimeOnly libs.junit.platform.launcher
}
