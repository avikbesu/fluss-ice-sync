apiVersion: fluss-sync.io/v1
kind: ApplicationConfig
spec:
  parsing:
    nullLiteral: ""
    timestampFormat: "yyyy-MM-dd'T'HH:mm:ss"
    dateFormat: "yyyy-MM-dd"

  retention:
    enabled: true
    days: 15

  health:
    enabled: true
    port: 8080
    path: /healthz

  lakehouse:
    enabledByDefault: false
    defaultFreshness: "30s"
