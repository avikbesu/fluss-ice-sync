# Config for the nl-config service (app/nl-config). Mounted read-only into
# the container at /config/application.yaml, matching every other app's
# existing "one YAML file per app" pattern -- see
# app/nl-config/src/main/resources/application.yml for the baked-in
# defaults this overrides.
#
# `nlconfig.store.directory` is the one setting that actually matters here
# for this repo's deployment -- it must point at wherever
# docker-compose.app.yml mounts the fluss-ice-sync-nl-config-data volume
# (see that file), not the application.yml default.

nlconfig:
  store:
    directory: /data/configs
